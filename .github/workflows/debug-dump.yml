name: Debug page dump

on:
  push:
    paths:
      - "scraper/dump.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python scraper/dump.py
      - name: Save dumps
        run: |
          git config user.name "fight-data-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/debug
          git commit -m "Debug page dump" || echo "nothing to commit"
          git pull --rebase
          git push
