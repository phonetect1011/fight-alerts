name: Build APK

on:
  push:
    paths-ignore:
      - "data/**"
      - "scraper/**"
      - ".github/workflows/scrape.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Restore signing key (so updates install over the old app)
        env:
          KEY: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          mkdir -p ~/.android
          if [ -n "$KEY" ]; then
            echo "$KEY" | base64 -d > ~/.android/debug.keystore
          else
            echo "::warning::No DEBUG_KEYSTORE_B64 secret set - you'll have to uninstall before installing each new build"
          fi

      - name: Build
        run: gradle assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: FightAlerts-apk
          path: build/outputs/apk/debug/*.apk
