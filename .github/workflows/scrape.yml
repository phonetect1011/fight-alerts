name: Update fight data

# Fight cards and results come from Wikipedia (official MediaWiki API, CC BY-SA content).
# Start times: your data/time-overrides.json, then UFC.com (UFC events), then TheSportsDB,
# then bookmaker times (The Odds API) if close to our estimate.
#
# How often it runs:
#   - A quick check wakes up every 15 minutes.
#   - On fight night (from 30 min before the first fight until 12 hours after the main card,
#     while any bout is still missing a result) it scrapes every time, so results show up fast.
#   - Otherwise it only scrapes when the data is ~2 hours old.
#   - Odds are downloaded fresh only when the saved odds are 6+ hours old (~240 free credits a month).
#   - cron-job.org also starts it every 10 min with auto=true (GitHub's own schedule often runs late).
#     Those runs follow the same rules as the schedule above; a run by hand always scrapes.
on:
  schedule:
    - cron: "7,22,37,52 * * * *"   # every 15 min (off the hour, GitHub delays :00 runs the most)
  workflow_dispatch:                # run it by hand from the Actions tab (or cron-job.org with auto=true)
    inputs:
      auto:
        description: "Started by cron-job.org (leave unticked when running by hand)"
        type: boolean
        default: false
  push:                             # re-run straight away whenever the scrapers change
    branches: [main]                # (only on main, so test branches don't get data commits)
    paths:
      - "scraper/wiki.py"
      - "scraper/times.py"
      - "scraper/odds.py"
      - "scraper/records.py"
      - "data/time-overrides.json"   # edit this to fix a start time; the app updates in a few minutes

permissions:
  contents: write
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      run: ${{ steps.decide.outputs.run }}
      fresh_odds: ${{ steps.decide.outputs.fresh_odds }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: data
          sparse-checkout-cone-mode: true

      - name: Fight night? Data old? Odds old?
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          AUTO: ${{ github.event.inputs.auto }}
        run: |
          python3 - <<'PY'
          import json, os, time

          now = int(time.time() * 1000)
          MIN = 60_000
          HOUR = 60 * MIN
          event = os.environ.get("EVENT", "")
          if event == "workflow_dispatch" and os.environ.get("AUTO") == "true":
              event = "schedule"    # cron-job.org: same rules as GitHub's schedule

          try:
              with open("data/events.json") as f:
                  data = json.load(f)
          except Exception:
              data = {}

          reasons = []

          # 1) run by hand or scraper changed: always scrape
          if event != "schedule":
              reasons.append(f"triggered by {event}")

          # 2) fight night: an event that has started (or is about to) and still has bouts without results
          for e in data.get("events", []):
              if e.get("finished"):
                  continue
              start = e.get("startMs")
              if not start:
                  continue
              first = min(x for x in (e.get("earlyPrelimsMs"), e.get("prelimsMs"), start) if x)
              if first - 30 * MIN <= now <= start + 12 * HOUR:
                  reasons.append(f"fight night: {e.get('title')}")

          # 3) normal pace: data is getting on for 2 hours old
          gen = data.get("generatedMs") or 0
          if now - gen >= 110 * MIN:
              reasons.append(f"data is {(now - gen) // MIN} min old")

          run = bool(reasons)

          # Odds: fresh download when run by hand / scraper changed, or when the saved odds are 6+ hours old
          fetched = 0
          try:
              with open("data/odds-cache.json") as f:
                  fetched = json.load(f).get("fetchedMs") or 0
          except Exception:
              pass
          fresh_odds = event != "schedule" or now - fetched >= 6 * HOUR - 10 * MIN

          print("Scrape:", "YES" if run else "no", "|", "; ".join(reasons) or "nothing to do")
          print("Odds:", "fresh download" if fresh_odds else f"use saved (fetched {(now - fetched) // MIN} min ago)")

          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"run={'true' if run else 'false'}\n")
              out.write(f"fresh_odds={'true' if fresh_odds else 'false'}\n")
          PY

  update:
    needs: check
    if: needs.check.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:              # one scrape at a time; a new one waits instead of killing the one running
      group: fight-data
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install libraries
        run: pip install requests

      - name: Fight cards from Wikipedia
        id: cards
        continue-on-error: true
        timeout-minutes: 12
        run: python scraper/wiki.py data/events.json

      - name: Missing fight records from ESPN (UFC + PFL)
        continue-on-error: true
        timeout-minutes: 3
        run: python scraper/records.py data/events.json

      - name: Odds and start times from The Odds API
        id: odds
        continue-on-error: true
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          ODDS_USE_CACHE: ${{ needs.check.outputs.fresh_odds == 'true' && '0' || '1' }}
        run: python scraper/odds.py data/events.json

      - name: Confirmed start times (your overrides + UFC.com + TheSportsDB, then section times)
        continue-on-error: true
        timeout-minutes: 5
        run: python scraper/times.py data/events.json

      - name: Save data to repo
        run: |
          git config user.name "fight-data-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/events.json
          git add data/photo-cache.json data/times-cache.json data/odds-cache.json 2>/dev/null || true
          git add data/debug/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update fight data"
            for i in 1 2 3; do
              git pull --rebase -X theirs && git push && break
              sleep 5
            done
          fi

      - name: Report breakage (opens a GitHub issue)
        if: steps.cards.outcome == 'failure' || steps.odds.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TITLE="Fight data scraper is broken"
          BODY=""
          if [ "${{ steps.cards.outcome }}" = "failure" ]; then
            BODY="$(cat data/health.txt 2>/dev/null || echo 'The Wikipedia scraper crashed before writing a report.')"
          fi
          if [ "${{ steps.odds.outcome }}" = "failure" ]; then
            BODY="$BODY

          $(cat data/odds-health.txt 2>/dev/null || echo 'The odds fetcher crashed before writing a report.')"
          fi
          BODY="$BODY

          Run log: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          EXISTING=$(gh issue list --state open --search "$TITLE in:title" --json number --jq '.[0].number')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$BODY"
          else
            gh issue create --title "$TITLE" --body "$BODY"
          fi
          exit 1

      - name: Close issue when everything works again
        if: steps.cards.outcome == 'success' && steps.odds.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for N in $(gh issue list --state open --search "Fight data scraper is broken in:title" --json number --jq '.[].number'); do
            gh issue close "$N" --comment "Fight data is updating again (Wikipedia + The Odds API) ✅"
          done
