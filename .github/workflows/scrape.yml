name: Update fight data

# Fight cards come from Wikipedia (official MediaWiki API, CC BY-SA content).
# Start times: your data/time-overrides.json, then TheSportsDB, then bookmaker times (The Odds API) if close to our estimate.
on:
  schedule:
    - cron: "17 */6 * * *"   # every 6 hours (~240 of the 500 free odds credits a month)
  workflow_dispatch:          # run it by hand from the Actions tab
  push:                       # re-run straight away whenever the scrapers change
    paths:
      - "scraper/wiki.py"
      - "scraper/times.py"
      - "scraper/odds.py"
      - "data/time-overrides.json"   # edit this to fix a start time; the app updates in a few minutes

permissions:
  contents: write
  issues: write

concurrency:                  # a new run replaces one that's still going
  group: fight-data
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install libraries
        run: pip install requests

      - name: Fight cards from Wikipedia
        id: cards
        continue-on-error: true
        timeout-minutes: 12
        run: python scraper/wiki.py data/events.json

      - name: Odds and start times from The Odds API
        id: odds
        continue-on-error: true
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python scraper/odds.py data/events.json

      - name: Confirmed start times (your overrides + TheSportsDB, then section times)
        continue-on-error: true
        timeout-minutes: 5
        run: python scraper/times.py data/events.json

      - name: Save data to repo
        run: |
          git config user.name "fight-data-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/events.json
          git add data/photo-cache.json data/times-cache.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update fight data"
            git pull --rebase
            git push
          fi

      - name: Report breakage (opens a GitHub issue)
        if: steps.cards.outcome == 'failure' || steps.odds.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TITLE="Fight data scraper is broken"
          BODY=""
          if [ "${{ steps.cards.outcome }}" = "failure" ]; then
            BODY="$(cat data/health.txt 2>/dev/null || echo 'The Wikipedia scraper crashed before writing a report.')"
          fi
          if [ "${{ steps.odds.outcome }}" = "failure" ]; then
            BODY="$BODY

          $(cat data/odds-health.txt 2>/dev/null || echo 'The odds fetcher crashed before writing a report.')"
          fi
          BODY="$BODY

          Run log: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          EXISTING=$(gh issue list --state open --search "$TITLE in:title" --json number --jq '.[0].number')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$BODY"
          else
            gh issue create --title "$TITLE" --body "$BODY"
          fi
          exit 1

      - name: Close issue when everything works again
        if: steps.cards.outcome == 'success' && steps.odds.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for N in $(gh issue list --state open --search "Fight data scraper is broken in:title" --json number --jq '.[].number'); do
            gh issue close "$N" --comment "Fight data is updating again (Wikipedia + The Odds API) ✅"
          done
