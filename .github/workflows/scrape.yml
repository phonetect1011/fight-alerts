name: Update fight data

on:
  schedule:
    - cron: "17 */6 * * *"   # every 6 hours
  workflow_dispatch:          # lets you run it manually from the Actions tab
  push:                       # re-run straight away whenever the scraper is changed
    paths:
      - "scraper/scrape.py"

permissions:
  contents: write
  issues: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install scraper libraries
        run: pip install requests beautifulsoup4

      - name: Scrape fights
        id: scrape
        continue-on-error: true
        run: python scraper/scrape.py data/events.json

      - name: Save data to repo
        run: |
          git config user.name "fight-data-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/events.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update fight data"
            git pull --rebase
            git push
          fi

      - name: Report breakage (opens a GitHub issue)
        if: steps.scrape.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TITLE="Fight data scraper is broken"
          BODY="$(cat data/health.txt 2>/dev/null || echo 'The scraper crashed before writing a report.')"
          BODY="$BODY

          Run log: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          EXISTING=$(gh issue list --state open --search "$TITLE in:title" --json number --jq '.[0].number')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$BODY"
          else
            gh issue create --title "$TITLE" --body "$BODY"
          fi
          exit 1

      - name: Close issue when it's working again
        if: steps.scrape.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for N in $(gh issue list --state open --search "Fight data scraper is broken in:title" --json number --jq '.[].number'); do
            gh issue close "$N" --comment "Scraper is working again ✅"
          done
